<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="每日行业动量追踪与评分看板">
  <title>行业动量雷达</title>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.7/chart.umd.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/alpinejs/3.14.9/cdn.min.js"></script>
  <style>
    :root {
      --ink: #17202a;
      --muted: #68727d;
      --paper: #f6f3ec;
      --panel: #fffdf8;
      --line: #ded8cd;
      --accent: #0b6b5b;
      --accent-soft: #dceee8;
      --warm: #c66a36;
      --danger: #aa3f34;
      --shadow: 0 16px 36px rgba(40, 44, 41, 0.08);
    }

    * { box-sizing: border-box; }
    [x-cloak] { display: none !important; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 0%, rgba(11, 107, 91, 0.12), transparent 28rem),
        linear-gradient(180deg, #f8f6f0 0%, var(--paper) 100%);
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    }

    button, a { font: inherit; }
    button { color: inherit; }

    .shell {
      width: min(1180px, calc(100% - 36px));
      margin: 0 auto;
      padding: 30px 0 56px;
    }

    .masthead {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      padding: 8px 0 24px;
      border-bottom: 1px solid var(--line);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Songti SC", serif;
      font-size: clamp(32px, 5vw, 58px);
      font-weight: 500;
      line-height: 0.98;
      letter-spacing: -0.04em;
    }

    .masthead-note {
      max-width: 360px;
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
      text-align: right;
    }

    .tabs {
      display: flex;
      gap: 8px;
      padding: 20px 0;
      overflow-x: auto;
    }

    .tab {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 9px 17px;
      background: rgba(255, 253, 248, 0.72);
      cursor: pointer;
      white-space: nowrap;
      transition: 160ms ease;
    }

    .tab:hover:not(:disabled) {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .tab.active {
      color: white;
      border-color: var(--accent);
      background: var(--accent);
    }

    .tab:disabled {
      opacity: 0.42;
      cursor: not-allowed;
    }

    .status-strip {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1px;
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      background: var(--line);
      box-shadow: var(--shadow);
    }

    .status-item {
      min-height: 96px;
      padding: 18px 20px;
      background: var(--panel);
    }

    .label {
      display: block;
      margin-bottom: 9px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .status-value {
      font-family: Georgia, "Songti SC", serif;
      font-size: 20px;
      line-height: 1.35;
    }

    .progress-note {
      color: var(--warm);
      font-size: 14px;
      font-weight: 700;
    }

    .download-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 20px 0 26px;
    }

    .action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      border: 1px solid var(--ink);
      border-radius: 10px;
      padding: 10px 15px;
      color: var(--ink);
      background: transparent;
      text-decoration: none;
      cursor: pointer;
      transition: 160ms ease;
    }

    .action:hover:not(:disabled) {
      color: white;
      background: var(--ink);
    }

    .action.primary {
      color: white;
      border-color: var(--accent);
      background: var(--accent);
    }

    .action:disabled {
      color: #999;
      border-color: #ccc;
      background: #ece9e2;
      cursor: not-allowed;
    }

    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin: 34px 0 16px;
    }

    .section-head h2 {
      margin: 0;
      font-family: Georgia, "Songti SC", serif;
      font-size: clamp(25px, 4vw, 38px);
      font-weight: 500;
    }

    .section-head p {
      max-width: 520px;
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      text-align: right;
    }

    .ranking-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .rank-card {
      position: relative;
      min-height: 220px;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 20px;
      overflow: hidden;
      background: var(--panel);
      box-shadow: 0 10px 24px rgba(40, 44, 41, 0.05);
      cursor: pointer;
      transition: 180ms ease;
    }

    .rank-card::after {
      content: "";
      position: absolute;
      right: -26px;
      bottom: -42px;
      width: 120px;
      height: 120px;
      border: 18px solid var(--accent-soft);
      border-radius: 50%;
      opacity: 0.72;
    }

    .rank-card:hover {
      border-color: var(--accent);
      transform: translateY(-3px);
      box-shadow: var(--shadow);
    }

    .rank-title {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }

    .rank-number {
      color: var(--warm);
      font-family: Georgia, serif;
      font-size: 14px;
      font-weight: 700;
    }

    .industry-name {
      margin: 10px 0 18px;
      font-family: Georgia, "Songti SC", serif;
      font-size: 23px;
      font-weight: 600;
    }

    .score-line {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .score {
      font-family: Georgia, serif;
      font-size: 38px;
      line-height: 1;
    }

    .score.pending {
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
    }

    .change {
      font-size: 13px;
      font-weight: 800;
    }

    .change.up { color: var(--accent); }
    .change.down { color: var(--danger); }
    .change.flat { color: var(--muted); }

    .metric-tags {
      position: relative;
      z-index: 1;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 20px;
    }

    .tag {
      border-radius: 6px;
      padding: 6px 8px;
      color: #33403d;
      background: #eeeae1;
      font-size: 11px;
    }

    .empty-state, .error-box {
      border: 1px dashed var(--line);
      border-radius: 16px;
      padding: 42px 24px;
      color: var(--muted);
      background: rgba(255, 253, 248, 0.7);
      text-align: center;
    }

    .error-box {
      margin-bottom: 18px;
      color: var(--danger);
      border-color: rgba(170, 63, 52, 0.4);
    }

    .back {
      margin-bottom: 18px;
      border: 0;
      padding: 0;
      color: var(--accent);
      background: transparent;
      font-weight: 800;
      cursor: pointer;
    }

    .detail-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(320px, 0.75fr);
      gap: 18px;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 20px;
      background: var(--panel);
      box-shadow: 0 10px 24px rgba(40, 44, 41, 0.05);
    }

    .chart-wrap {
      position: relative;
      height: 380px;
    }

    .metric-list {
      display: grid;
      gap: 10px;
      max-height: 430px;
      overflow: auto;
    }

    .metric-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px 16px;
      border-bottom: 1px solid var(--line);
      padding: 12px 0;
    }

    .metric-row:last-child { border-bottom: 0; }
    .metric-name { font-weight: 800; word-break: break-word; }
    .metric-value { font-family: Georgia, serif; font-size: 19px; }
    .metric-meta { color: var(--muted); font-size: 12px; line-height: 1.6; }

    .industry-picker {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 16px 0 20px;
    }

    .check-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 11px;
      background: var(--panel);
      font-size: 13px;
      cursor: pointer;
    }

    .check-pill:has(input:checked) {
      color: var(--accent);
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .loading {
      padding: 60px 0;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 900px) {
      .ranking-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .detail-layout { grid-template-columns: 1fr; }
      .masthead { align-items: flex-start; flex-direction: column; }
      .masthead-note { text-align: left; }
    }

    @media (max-width: 620px) {
      .shell { width: min(100% - 24px, 1180px); padding-top: 18px; }
      .status-strip { grid-template-columns: 1fr; }
      .status-item { min-height: 0; }
      .ranking-grid { grid-template-columns: 1fr; }
      .section-head { align-items: flex-start; flex-direction: column; }
      .section-head p { text-align: left; }
      .download-row { display: grid; grid-template-columns: 1fr; }
      .action { width: 100%; }
      .chart-wrap { height: 310px; }
    }
  </style>
</head>
<body>
  <main class="shell" x-data="dashboard" x-init="init()" x-cloak>
    <header class="masthead">
      <div>
        <p class="eyebrow">Industry momentum intelligence</p>
        <h1>行业动量雷达</h1>
      </div>
      <p class="masthead-note">
        汇总资本动量、技术活跃度与外部信号，持续观察行业变化，不把短期噪声误判为长期趋势。
      </p>
    </header>

    <nav class="tabs" aria-label="视图切换">
      <button class="tab" :class="{ active: view === 'dashboard' }" @click="showDashboard()">主看板</button>
      <button class="tab" :class="{ active: view === 'detail' }" :disabled="!selectedIndustry" @click="showDetail()">行业详情</button>
      <button class="tab" :class="{ active: view === 'history' }" @click="showHistory()">历史对比</button>
    </nav>

    <div class="error-box" x-show="error" x-text="error"></div>
    <div class="loading" x-show="loading">正在读取最新行业数据...</div>

    <section x-show="!loading && view === 'dashboard'">
      <div class="status-strip">
        <div class="status-item">
          <span class="label">最后更新</span>
          <strong class="status-value" x-text="meta.last_updated || '暂无数据'"></strong>
        </div>
        <div class="status-item">
          <span class="label">当前评分模式</span>
          <strong class="status-value" x-text="meta.ranking_mode || '读取中'"></strong>
        </div>
        <div class="status-item">
          <span class="label">历史积累进度</span>
          <strong class="status-value" x-text="`${meta.archive_days || 0} / 28 天`"></strong>
          <div class="progress-note" x-show="meta.days_until_full_mode > 0" x-text="`距完整模式还需 ${meta.days_until_full_mode} 天`"></div>
        </div>
      </div>

      <div class="download-row">
        <a class="action primary" href="/api/download/latest">下载今日指标 CSV</a>
        <a
          class="action"
          href="/api/download/scores"
          :aria-disabled="scoresUnavailable"
          :title="scoresUnavailable ? '今日评分文件尚未生成' : '下载今日评分 CSV'"
          @click="guardScoreDownload($event)"
        >下载今日评分 CSV</a>
        <a class="action" href="/api/download/history">下载全部历史 CSV</a>
      </div>

      <div class="section-head">
        <h2>行业排名</h2>
        <p>综合分按最新一期降序排列。点击任意卡片查看该行业的 30 天趋势与指标状态。</p>
      </div>

      <div class="empty-state" x-show="ranking.length === 0">
        数据积累中，预计还需 <strong x-text="meta.days_until_full_mode || 0"></strong> 天进入完整评分模式。
      </div>

      <div class="ranking-grid" x-show="ranking.length > 0">
        <template x-for="item in ranking" :key="item.industry">
          <article class="rank-card" tabindex="0" @click="openIndustry(item.industry)" @keydown.enter="openIndustry(item.industry)">
            <div class="rank-title">
              <span class="rank-number" x-text="item.ranking ? `NO. ${String(item.ranking).padStart(2, '0')}` : 'PENDING'"></span>
              <span class="change" :class="changeClass(item.score_change)" x-text="changeText(item.score_change)"></span>
            </div>
            <h3 class="industry-name" x-text="item.industry"></h3>
            <div class="score-line">
              <strong class="score" x-show="item.composite_score !== null" x-text="formatNumber(item.composite_score, 2)"></strong>
              <strong class="score pending" x-show="item.composite_score === null">数据积累中</strong>
            </div>
            <div class="metric-tags">
              <span class="tag" x-text="`资本动量 ${formatNumber(item.capital_momentum_score, 1)}`"></span>
              <span class="tag" x-text="`技术活跃度 ${formatNumber(item.tech_activity_score, 1)}`"></span>
              <span class="tag" x-text="`外部信号 ${formatNumber(item.external_signal_score, 1)}`"></span>
            </div>
          </article>
        </template>
      </div>
    </section>

    <section x-show="!loading && view === 'detail'">
      <button class="back" @click="showDashboard()">← 返回主看板</button>
      <div class="section-head">
        <h2 x-text="selectedIndustry || '行业详情'"></h2>
        <a
          class="action"
          :href="`/api/download/history?industry=${encodeURIComponent(selectedIndustry)}`"
        >下载该行业历史数据</a>
      </div>

      <div class="detail-layout">
        <div class="panel">
          <span class="label">过去 30 天综合分趋势</span>
          <div class="chart-wrap"><canvas id="detailChart"></canvas></div>
        </div>
        <div class="panel">
          <span class="label">最新指标状态</span>
          <div class="metric-list">
            <template x-for="metric in detail.latest_metrics || []" :key="metric.metric">
              <div class="metric-row">
                <div>
                  <div class="metric-name" x-text="metric.metric"></div>
                  <div class="metric-meta" x-text="`${metric.status || 'unknown'} · ${metric.momentum_status || '暂无动量状态'}`"></div>
                  <div class="metric-meta" x-text="`4周增长 ${formatPercent(metric.growth_rate_4w)} · Z分数 ${formatNumber(metric.z_score_12w, 2)}`"></div>
                </div>
                <div class="metric-value" x-text="formatNumber(metric.value, 2)"></div>
              </div>
            </template>
            <div class="empty-state" x-show="!(detail.latest_metrics || []).length">暂无可展示指标。</div>
          </div>
        </div>
      </div>
    </section>

    <section x-show="!loading && view === 'history'">
      <div class="section-head">
        <h2>历史对比</h2>
        <p>历史不足 28 天时综合分可能为空，折线图仅显示有效数据点。</p>
      </div>
      <div class="industry-picker">
        <template x-for="industry in industries" :key="industry">
          <label class="check-pill">
            <input type="checkbox" :value="industry" x-model="selectedIndustries" @change="$nextTick(() => renderHistoryChart())">
            <span x-text="industry"></span>
          </label>
        </template>
      </div>
      <div class="panel">
        <div class="chart-wrap"><canvas id="historyChart"></canvas></div>
      </div>
    </section>
  </main>

  <script>
    document.addEventListener("alpine:init", () => {
      Alpine.data("dashboard", () => ({
        view: "dashboard",
        loading: true,
        error: "",
        meta: {},
        ranking: [],
        history: [],
        detail: { latest_metrics: [], score_history_30d: [], metric_history_30d: [] },
        selectedIndustry: "",
        selectedIndustries: [],
        detailChart: null,
        historyChart: null,
        colors: ["#0b6b5b", "#c66a36", "#385f86", "#8a5b78", "#7d7b36", "#aa3f34", "#4b8178", "#7c664d"],

        get industries() {
          return [...new Set(this.history.map(row => row.industry))].sort((a, b) => a.localeCompare(b, "zh-CN"));
        },

        get scoresUnavailable() {
          return this.meta.ranking_mode === "历史数据不足";
        },

        async init() {
          try {
            const [meta, ranking, history] = await Promise.all([
              this.fetchJson("/api/meta"),
              this.fetchJson("/api/ranking"),
              this.fetchJson("/api/history?days=60")
            ]);
            this.meta = meta;
            this.ranking = ranking;
            this.history = history;
            const ranked = ranking.filter(item => item.composite_score !== null).slice(0, 5).map(item => item.industry);
            this.selectedIndustries = ranked.length ? ranked : this.industries.slice(0, 5);
          } catch (error) {
            this.error = `数据读取失败：${error.message}`;
          } finally {
            this.loading = false;
          }
        },

        async fetchJson(url) {
          const response = await fetch(url);
          if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
          return response.json();
        },

        showDashboard() {
          this.view = "dashboard";
        },

        async showDetail() {
          if (!this.selectedIndustry) return;
          this.view = "detail";
          await this.loadIndustry();
        },

        showHistory() {
          this.view = "history";
          this.$nextTick(() => this.renderHistoryChart());
        },

        async openIndustry(industry) {
          this.selectedIndustry = industry;
          await this.showDetail();
        },

        async loadIndustry() {
          this.error = "";
          try {
            this.detail = await this.fetchJson(`/api/industry/${encodeURIComponent(this.selectedIndustry)}`);
            this.$nextTick(() => this.renderDetailChart());
          } catch (error) {
            this.error = `行业详情读取失败：${error.message}`;
          }
        },

        renderDetailChart() {
          const canvas = document.getElementById("detailChart");
          if (!canvas) return;
          if (this.detailChart) this.detailChart.destroy();
          const rows = (this.detail.score_history_30d || []).filter(row => row.composite_score !== null);
          this.detailChart = new Chart(canvas, {
            type: "line",
            data: {
              labels: rows.map(row => row.date),
              datasets: [{
                label: "综合分",
                data: rows.map(row => row.composite_score),
                borderColor: "#0b6b5b",
                backgroundColor: "rgba(11, 107, 91, 0.12)",
                borderWidth: 3,
                pointRadius: 3,
                tension: 0.28,
                fill: true
              }]
            },
            options: this.chartOptions("综合分")
          });
        },

        renderHistoryChart() {
          const canvas = document.getElementById("historyChart");
          if (!canvas || typeof Chart === "undefined") return;
          if (this.historyChart) this.historyChart.destroy();
          const dates = [...new Set(this.history.map(row => row.date))].sort();
          const datasets = this.selectedIndustries.map((industry, index) => {
            const byDate = new Map(
              this.history
                .filter(row => row.industry === industry && row.composite_score !== null)
                .map(row => [row.date, row.composite_score])
            );
            return {
              label: industry,
              data: dates.map(date => byDate.has(date) ? byDate.get(date) : null),
              borderColor: this.colors[index % this.colors.length],
              backgroundColor: this.colors[index % this.colors.length],
              borderWidth: 2,
              pointRadius: 2,
              tension: 0.24,
              spanGaps: false
            };
          });
          this.historyChart = new Chart(canvas, {
            type: "line",
            data: { labels: dates, datasets },
            options: this.chartOptions("综合分")
          });
        },

        chartOptions(yTitle) {
          return {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: "index", intersect: false },
            plugins: {
              legend: { position: "bottom", labels: { usePointStyle: true, boxWidth: 8 } }
            },
            scales: {
              x: { grid: { display: false }, title: { display: true, text: "日期" } },
              y: { beginAtZero: false, title: { display: true, text: yTitle } }
            }
          };
        },

        guardScoreDownload(event) {
          if (!this.scoresUnavailable) return;
          event.preventDefault();
        },

        formatNumber(value, digits = 1) {
          if (value === null || value === undefined || Number.isNaN(Number(value))) return "—";
          return Number(value).toFixed(digits);
        },

        formatPercent(value) {
          if (value === null || value === undefined || Number.isNaN(Number(value))) return "—";
          return `${(Number(value) * 100).toFixed(1)}%`;
        },

        changeClass(value) {
          if (value > 0) return "up";
          if (value < 0) return "down";
          return "flat";
        },

        changeText(value) {
          if (value === null || value === undefined) return "较上期 —";
          if (value > 0) return `↑ +${Number(value).toFixed(2)}`;
          if (value < 0) return `↓ ${Number(value).toFixed(2)}`;
          return "→ 0.00";
        }
      }));
    });
  </script>
</body>
</html>
